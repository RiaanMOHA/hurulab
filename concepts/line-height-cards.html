<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hurulab line height cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cascadia+Mono:wght@200..700&display=swap" rel="stylesheet">
<style>
/* The Chinese headline face, cut down to the glyphs this page sets. */
@font-face{font-family:"Sarasa Mono TC";font-weight:700;font-display:block;
  src:url("fonts/sarasa-mono-tc-bold-subset.woff2") format("woff2")}
:root{
  font-size:clamp(1rem,0.925rem + 0.3333vw,1.25rem);
  --n-50:oklch(0.988 0.004 286);
  --n-100:oklch(0.966 0.006 286);
  --n-200:oklch(0.938 0.009 286);
  --n-600:oklch(0.520 0.032 283);
  --n-950:oklch(0.196 0.026 280);
  --p-hover:oklch(0.640 0.150 318);
  --p-default:oklch(0.500 0.150 318);
  --p-violet:oklch(0.330 0.110 318);
  --surface-page:var(--n-50);
  --surface-raised:var(--n-100);
  --surface-brand:var(--p-default);
  --surface-brand-hover:var(--p-violet);
  --text-primary:var(--n-950);
  --text-soft:var(--n-600);
  --text-on-brand:var(--n-50);
  --border-subtle:var(--n-200);
  --border-focus:var(--p-hover);
  --font-h:"Cascadia Mono","Sarasa Mono TC",ui-monospace,"SF Mono",Menlo,monospace;
  --r-card:1.5rem; --r-cap:999px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-page);color:var(--text-primary)}
.wrap{padding:3rem 1.5rem}
@media(min-width:768px){.wrap{padding:5rem 3rem}}
.pair{display:grid;gap:1.5rem;margin-bottom:4rem}
@media(min-width:1024px){.pair{grid-template-columns:1fr 1fr}}
.card{background:var(--surface-raised);border:1px solid var(--border-subtle);
  border-radius:var(--r-card);corner-shape:squircle;padding:2.5rem 2rem;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  gap:2rem}
h1{margin:0;font-family:var(--font-h);font-weight:700;
  font-size:clamp(2.986rem,2.3rem + 3.24vw,4.8268rem);line-height:1.2;letter-spacing:-0.04em}
.soft{color:var(--text-soft)}
.keep{display:inline-block}
.btn{font:600 0.8333rem/1 var(--font-h);padding:0.9rem 1.5rem;border-radius:var(--r-cap);
  border:0;cursor:pointer;display:inline-flex;align-items:center;
  background:var(--surface-brand);color:var(--text-on-brand);text-decoration:none;
  transition:background 160ms ease}
.btn:hover{background:var(--surface-brand-hover)}
.btn:focus-visible{outline:2px solid var(--border-focus);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="pair">
    <div class="card" lang="zh-Hant">
      <h1><span class="soft"><span class="keep">你的</span><span class="keep">每月報告，</span></span><span class="keep">交給我們。</span></h1>
    </div>
    <div class="card">
      <h1><span class="soft">Your product catalog,</span> handled.</h1>
      <a class="btn" href="#">Let's Talk</a>
    </div>
  </div>
</div>
</body>
</html>

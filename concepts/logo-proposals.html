:root {
  font-size: clamp(1.0625rem, 1.00625rem + 0.25vw, 1.25rem);
  --display:"Geist", system-ui, sans-serif;
  --surface-page:oklch(0.995 0.002 285);
  --surface-sunken:oklch(0.975 0.002 285);
  --text-primary:oklch(0.160 0.006 285);
  --text-tertiary:oklch(0.510 0.008 285);
  --brand:oklch(0.510 0.115 318);
  --border:oklch(0.900 0.003 285);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-font-smoothing:antialiased; }
body {
  background:var(--surface-page);
  font-family:var(--display);
  color:var(--text-primary);
  padding:3.5rem 1.5rem 5rem;
}
header { margin-bottom:2.5rem; }
h1 { font-size:1.6rem; font-weight:600; letter-spacing:-0.03em; }
.sub { margin-top:0.5rem; font-size:0.85rem; font-weight:400; color:var(--text-tertiary); }

.current {
  display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap;
  padding:1.75rem; margin-bottom:2.5rem;
  background:var(--surface-sunken); border-radius:1rem;
}
.label { font-size:0.72rem; font-weight:500; letter-spacing:0.1em; color:var(--text-tertiary); }
.asterisk-lockup { font-weight:700; font-size:2rem; letter-spacing:-0.04em; line-height:1; }
.asterisk-lockup i { font-style:normal; color:var(--brand); font-size:1.3em; line-height:0; vertical-align:0.1em; margin-right:-0.04em; }

.grid { display:grid; gap:1rem; grid-template-columns:1fr; }
@media (min-width:768px) { .grid { grid-template-columns:repeat(2,1fr); } }
@media (min-width:1440px) { .grid { grid-template-columns:repeat(3,1fr); } }

.card {
  background:var(--surface-sunken);
  border-radius:1rem;
  padding:2.5rem 1.75rem 1.25rem;
  display:flex; flex-direction:column; gap:1.75rem;
  min-width:0;
}
.lockup {
  display:flex; align-items:center; gap:0.32em;
  font-size:2rem; min-width:0;
}
.wordmark { font-weight:700; letter-spacing:-0.04em; color:var(--text-primary); line-height:1; }
.glyph {
  flex:none; display:block;
  height:1.06em; width:auto; max-width:1.6em;
  color:var(--brand); overflow:visible;
}
.pgl {
  aspect-ratio:var(--ar,1);
  background-color:var(--brand);
  -webkit-mask-image:var(--u); mask-image:var(--u);
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-size:var(--sx) var(--sy); mask-size:var(--sx) var(--sy);
  -webkit-mask-position:var(--px) var(--py); mask-position:var(--px) var(--py);
}
figcaption {
  font-size:0.74rem; font-weight:500; color:var(--text-tertiary);
  padding-top:1rem; border-top:1px solid var(--border);
}
.num { color:var(--text-primary); font-weight:600; margin-right:0.5rem; }
</style>
